scientific_choices:
- component: separated_word_training
  classification: ASSUMPTION
  rationale: Train on qualified V4-derived wider-gap full-word masks; WORD-GT-001.
    Original V4/strict targets are preserved.
- component: matched_v4_training_protocol
  classification: REPOSITORY_SPECIFIED
  rationale: Reuse V4 AG-U-Net, frozen ResNet50, FP32/batch8, 500 epochs, transforms,
    loss and TRAIN-IoU checkpoint selection for a target comparison.
- component: native128_target_topology
  classification: ASSUMPTION
  rationale: Existing paired transforms resize owner IDs with nearest and reapply
    contact separation; very small words can disappear at128. This is not a guarantee
    of original-resolution word survival.
