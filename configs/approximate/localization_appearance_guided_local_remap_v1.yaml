scientific_choices:
- component: component_area_padding_and_top10
  classification: PAPER_SPECIFIED
  evidence: papers/2503.15639v2.pdf section 3.3 Algorithm 1
- component: numeric_area_and_padding
  classification: REPOSITORY_SPECIFIED
  rationale: Preserve repository Amin=150 and padding=6; do not tune them.
- component: one_hop_appearance_grouping_and_thresholds
  classification: ASSUMPTION
  ambiguity_id: L-APP-001
  rationale: >
    Compare only mutual immediate neighbours of immutable v1 groups. At most
    three base groups can be consumed once. All raw descriptors in a candidate
    must agree; missing evidence forbids a new merge but never drops its base.
    These appearance values are unvalidated engineering hypotheses, not paper
    parameters. Existing modes, network, recognition and routing are unchanged.
- component: foreground_thickness_proxy
  classification: ASSUMPTION
  ambiguity_id: L-APP-001
  rationale: >
    Twice the median ridge radius of an exact L2 distance transform on the
    projected original foreground. This is not RGB SWT and cannot recover
    stroke detail lost at native128. Zero padding at ROI boundaries is explicit.
- component: geometry_and_evaluation
  classification: ASSUMPTION
  ambiguity_id: L-APP-001
  rationale: >
    Exact integer nearest projection for v1 identity; all gap/thickness/area
    measurements in original-image pixels. Report frozen v1 and a matched-area
    v1 control. GT is used only for geometry diagnostics after proposals exist.
