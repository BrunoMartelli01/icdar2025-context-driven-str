name: Collaboration checks (CPU, no models)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-navigation:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.4
      - run: python -m scripts.collaboration check
      - run: python -m research groups
      - run: python -m research catalog --check
      - run: python -m pytest -q tests/research tests/scripts/test_collaboration.py
