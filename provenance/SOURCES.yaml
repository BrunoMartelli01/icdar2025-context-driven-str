schema_version: 1
freeze_date: "2026-09-03"
scope: >-
  Scientific evidence freeze plus M6/M8/M9 physical-host qualifications, the full M9
  APPROXIMATE training run, ICDAR13 mirror-acquisition/split-manifest provenance, and
  complete real-data APPROXIMATE recognition-pipeline smoke and multi-image trace
  qualification; no external artifact is stored in the repository.

status_values:
  - RESOLVED
  - PARTIALLY_RESOLVED
  - UNRESOLVED
  - BLOCKING

evidence_classifications:
  PAPER_PRIMARY: "The frozen arXiv v2 paper."
  AUTHOR_PRIMARY: "The paper authors' public repository or institutional record."
  UPSTREAM_PRIMARY: "The official upstream project, model publisher, dataset site, or competition site."
  REPOSITORY_SECONDARY: "A choice present only in this repository; it does not establish what produced the paper results."
  REPRODUCTION_PRIMARY: "A controlled physical-host qualification produced by this reproduction project; it establishes local behavior, not paper identity."
  SECONDARY: "Non-author/non-upstream material; never sufficient by itself for a strict-reproduction choice."

decision_classifications:
  - PAPER_SPECIFIED
  - REPOSITORY_SPECIFIED
  - ASSUMPTION
  - HARDWARE_DEVIATION
  - UNRESOLVED

